<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Vera's Learning Games</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #ff6ec4 0%, #7873f5 50%, #4ade80 100%);
    background-attachment: fixed;
    color: #fff; padding: 24px 16px 40px;
    -webkit-text-size-adjust: 100%;
  }
  h1 { text-align: center; font-size: clamp(2rem, 6vw, 3.5rem); margin: 10px 0 6px; text-shadow: 0 4px 10px rgba(0,0,0,.25); }
  p.sub { text-align: center; font-size: clamp(1.1rem, 3vw, 1.5rem); margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; max-width: 1000px; margin: 0 auto; }
  a.card {
    display: block; text-decoration: none; color: #333; background: #fff;
    border-radius: 28px; padding: 30px 20px; text-align: center; min-height: 220px;
    box-shadow: 0 10px 25px rgba(0,0,0,.2); transition: transform .15s ease;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  a.card:active, a.card:hover { transform: scale(1.04); }
  .emoji { font-size: 4.5rem; line-height: 1.1; }
  .card h2 { font-size: 1.8rem; margin: 14px 0 8px; }
  .card p { font-size: 1.15rem; margin: 0; color: #555; }
  .c1 { border-bottom: 10px solid #ff6ec4; } .c1 h2 { color: #e0389f; }
  .c2 { border-bottom: 10px solid #7873f5; } .c2 h2 { color: #5a52e0; }
  .c3 { border-bottom: 10px solid #ef4444; } .c3 h2 { color: #dc2626; }
  .c4 { border-bottom: 10px solid #22c55e; } .c4 h2 { color: #16a34a; }
  .c5 { border-bottom: 10px solid #f59e0b; } .c5 h2 { color: #d97706; }
  footer { text-align: center; margin-top: 36px; font-size: 1rem; opacity: .9; }
</style>
</head>
<body>
  <h1>🌈 Vera's Learning Games 🌟</h1>
  <p class="sub">Tap a game to start playing!</p>
  <div class="grid">
    <a class="card c1" href="word-search-week5/">
      <div class="emoji">🔤</div><h2>Word Search</h2><p>Week 5 spelling words</p>
    </a>
    <a class="card c5" href="word-search-week6/">
      <div class="emoji">🔠</div><h2>Word Search</h2><p>Week 6 spelling words</p>
    </a>
    <a class="card c2" href="times-tables/">
      <div class="emoji">✖️</div><h2>Times Tables</h2><p>Practice multiplication</p>
    </a>
    <a class="card c3" href="canada-capitals/">
      <div class="emoji">🍁</div><h2>Canada Capitals</h2><p>Provinces &amp; territories</p>
    </a>
    <a class="card c4" href="canada-map/">
      <div class="emoji">🗺️</div><h2>Canada Map</h2><p>Find &amp; name the provinces</p>
    </a>
  </div>
  <footer>Have fun learning! 🎉</footer>
</body>
</html>
