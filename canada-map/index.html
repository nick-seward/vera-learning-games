<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Vera's Canada Map Game</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#ff9a9e 0%,#fecfef 30%,#a1c4fd 70%,#c2e9fb 100%);
  color:#2b2250;touch-action:manipulation;-webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
button{font-family:Arial,Helvetica,sans-serif;touch-action:manipulation;cursor:pointer;border:none;-webkit-appearance:none;appearance:none;color:#fff;font-weight:bold}
.screen{position:fixed;inset:0;display:none;height:100vh;height:100dvh;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.screen.on{display:flex}
h1{margin:0;font-size:clamp(26px,5.2vw,50px);color:#fff;text-shadow:0 3px 0 #e8457a,0 6px 14px rgba(0,0,0,.2);text-align:center;line-height:1.15}
/* start */
#start{flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:auto;text-align:center}
#start .sub{font-size:clamp(18px,3vw,24px);font-weight:bold;color:#5a2a82;margin:0}
.modes{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;width:100%;max-width:900px}
.mode{flex:1 1 240px;max-width:300px;min-height:170px;border-radius:28px;padding:18px 14px;font-size:clamp(22px,3.2vw,28px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 0 rgba(0,0,0,.18),0 12px 24px rgba(0,0,0,.15);transition:transform .1s}
.mode:active{transform:translateY(4px) scale(.98)}
.mode .em{font-size:52px;line-height:1}
.mode small{font-size:16px;font-weight:normal;opacity:.95}
.mode .best{font-size:16px;background:rgba(255,255,255,.25);border-radius:999px;padding:4px 12px;margin-top:4px}
#mFind{background:linear-gradient(135deg,#ff6ec4,#e8457a)}
#mName{background:linear-gradient(135deg,#7873f5,#4f46e5)}
#mLearn{background:linear-gradient(135deg,#34d399,#059669)}
.mini{width:min(420px,70vw);opacity:.95}
/* game */
#game{flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.bar .title{font-size:clamp(18px,2.6vw,26px);font-weight:bold;color:#fff;text-shadow:0 2px 0 #e8457a;flex:1 1 auto;text-align:center;min-width:150px}
.pill{background:rgba(255,255,255,.9);border-radius:999px;padding:8px 14px;font-weight:bold;font-size:clamp(16px,2.4vw,20px);box-shadow:0 3px 8px rgba(0,0,0,.08);white-space:nowrap}
.btn{min-height:52px;min-width:52px;border-radius:18px;padding:8px 16px;font-size:clamp(17px,2.4vw,21px);background:linear-gradient(135deg,#7873f5,#4f46e5);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.home{background:linear-gradient(135deg,#fb923c,#f97316)}
.btn.zoom{background:linear-gradient(135deg,#06b6d4,#0284c7)}
.btn.zoom.zoomed{background:linear-gradient(135deg,#f472b6,#db2777)}
.btn.next{background:linear-gradient(135deg,#22c55e,#15803d);font-size:clamp(20px,3vw,26px);padding:10px 28px}
.main{flex:1;min-height:0;display:grid;gap:8px;grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"prompt" "map" "panel"}
.mapbox{grid-area:map}.prompt{grid-area:prompt}.panel{grid-area:panel}
.mapbox{position:relative;flex:1;min-height:0;background:linear-gradient(#cfeaff,#b3dcff);border-radius:24px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.7),0 6px 16px rgba(0,0,0,.12);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.panel{display:flex;flex-direction:column;align-items:center;gap:8px}
.prompt{background:#fff;border-radius:20px;padding:10px 18px;font-size:clamp(22px,4vw,36px);font-weight:bold;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.1);width:100%;color:#3b2a8a}
.prompt .q{display:block;font-size:.55em;color:#7a6aa8;font-weight:bold}
.fb{min-height:1.4em;font-size:clamp(19px,3vw,26px);font-weight:bold;text-align:center;color:#5a2a82}
.fb.good{color:#15803d}.fb.bad{color:#dc2626}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;width:100%}
.choice{min-height:58px;border-radius:18px;font-size:clamp(17px,2.4vw,21px);padding:6px 10px;background:linear-gradient(135deg,#a78bfa,#7c3aed);box-shadow:0 5px 0 rgba(0,0,0,.18);line-height:1.15}
.choice:nth-child(2){background:linear-gradient(135deg,#f472b6,#db2777)}
.choice:nth-child(3){background:linear-gradient(135deg,#38bdf8,#0284c7)}
.choice:nth-child(4){background:linear-gradient(135deg,#fb923c,#ea580c)}
.choice:nth-child(5){background:linear-gradient(135deg,#2dd4bf,#0d9488)}
.choice.right{background:#16a34a!important;box-shadow:0 0 0 5px #bbf7d0}
.choice.wrong{background:#dc2626!important;box-shadow:0 0 0 5px #fecaca}
.choice.dim{opacity:.45}
.hidden{display:none!important}
@media (orientation:landscape){
  .main{grid-template-columns:1fr clamp(260px,29vw,360px);grid-template-rows:auto 1fr;grid-template-areas:"map prompt" "map panel"}
  .panel{justify-content:flex-start}
  .choices{grid-template-columns:1fr}
}
@media (orientation:portrait){ .choices{grid-template-columns:repeat(2,1fr)} .choices .choice:last-child:nth-child(odd){grid-column:1/-1} }
/* map styling */
.reg .land{stroke:#3b3b5c;stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s}
.reg .hit{fill:transparent;stroke:none}
.reg .callout{stroke:#3b3b5c;stroke-width:1.5;vector-effect:non-scaling-stroke}
.reg .cline{stroke:#3b3b5c;stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:3 3;fill:none;pointer-events:none}
.reg{cursor:pointer}
.reg.green .land,.reg.green .callout{fill:#22c55e!important;animation:flash .35s 3}
.reg.red .land,.reg.red .callout{fill:#ef4444!important;animation:flash .3s 3}
.reg.target .land,.reg.target .callout{fill:#facc15!important;stroke:#b45309;stroke-width:3;animation:pulse 1s infinite}
.reg.reveal .land,.reg.reveal .callout{fill:#facc15!important;stroke:#b45309;stroke-width:3;animation:pulse .7s infinite}
svg.zoomed .callout,svg.zoomed .cline,svg.zoomed circle.hit{display:none}
.reg.picked .land,.reg.picked .callout{fill:#86efac!important}
@keyframes flash{50%{opacity:.35}}
@keyframes pulse{50%{fill:#f59e0b}}
.ring{fill:none;stroke:#f59e0b;stroke-width:4;vector-effect:non-scaling-stroke;pointer-events:none;animation:ringp 1s infinite}
@keyframes ringp{50%{stroke:#ef4444;stroke-width:7}}
.tag{position:absolute;transform:translate(-50%,-115%);background:#fff;color:#2b2250;font-weight:bold;font-size:clamp(16px,2.4vw,22px);padding:6px 12px;border-radius:14px;box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap;border:3px solid #7c3aed;z-index:5}
.tag.red{border-color:#dc2626;color:#b91c1c}.tag.green{border-color:#16a34a;color:#166534}.tag.yel{border-color:#f59e0b}
.tag small{display:block;font-size:.72em;font-weight:normal;color:#555}
.tag.small{font-size:13px;padding:3px 7px;border-width:2px;transform:translate(-50%,-50%);opacity:.92}
.cheer{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5);font-size:clamp(40px,8vw,80px);pointer-events:none;opacity:0;z-index:6;text-shadow:0 4px 12px rgba(0,0,0,.2)}
.cheer.go{animation:pop 1s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
/* end */
#end{flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;overflow:hidden}
#end .card{background:rgba(255,255,255,.92);border-radius:30px;padding:24px 30px;box-shadow:0 12px 30px rgba(0,0,0,.2);max-width:600px;width:92%;z-index:2}
#end .big{font-size:clamp(30px,6vw,52px);font-weight:bold;color:#e8457a;margin:0 0 6px}
#end .stars{font-size:clamp(50px,10vw,90px);letter-spacing:6px;margin:6px 0}
#end .stars span{display:inline-block;animation:starIn .6s backwards}
#end .stars span:nth-child(2){animation-delay:.25s}#end .stars span:nth-child(3){animation-delay:.5s}
@keyframes starIn{0%{transform:scale(0) rotate(-180deg)}80%{transform:scale(1.3)}100%{transform:scale(1)}}
#end p{font-size:clamp(18px,3vw,24px);margin:6px 0;font-weight:bold;color:#3b2a8a}
#end .newbest{color:#db2777;font-size:clamp(22px,3.6vw,30px)}
#end .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#end .row .btn{font-size:24px;padding:14px 28px;min-height:64px}
.confetti{position:fixed;top:-60px;font-size:34px;pointer-events:none;animation:fall linear forwards;z-index:1}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.learnbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<!-- START -->
<section id="start" class="screen on">
  <h1>🍁 Vera's Canada Map Game 🗺️</h1>
  <p class="sub">10 provinces + 3 territories = 13 places to learn! 🇨🇦</p>
  <div id="miniMap" class="mini"></div>
  <div class="modes">
    <button class="mode" id="mFind"><span class="em">👆</span>Find it on the map<small>Tap the place I name!</small><span class="best" id="bestFind">Best: –</span></button>
    <button class="mode" id="mName"><span class="em">🤔</span>Name it<small>Pick the right name!</small><span class="best" id="bestName">Best: –</span></button>
    <button class="mode" id="mLearn"><span class="em">🔍</span>Practice / Learn<small>Tap to explore</small></button>
  </div>
</section>
<!-- GAME -->
<section id="game" class="screen">
  <div class="bar">
    <button class="btn home" id="homeBtn" aria-label="Home">🏠 Menu</button>
    <span class="pill" id="prog">✅ 0/13</span>
    <span class="pill" id="score">⭐ 0</span>
    <span class="title" id="gTitle">Vera's Canada Map Game</span>
    <button class="btn zoom" id="zoomBtn">🔍 Zoom east coast</button>
  </div>
  <div class="main">
    <div class="mapbox" id="mapbox">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="cheer" id="cheer">🎉</div>
    </div>
    <div class="prompt" id="prompt"></div>
    <div class="panel">
      <div class="choices" id="choices"></div>
      <div class="learnbar hidden" id="learnbar"><button class="btn" id="allNames">🏷️ Show all names</button></div>
      <div class="fb" id="fb"></div>
      <button class="btn next hidden" id="nextBtn">Next ➡️</button>
    </div>
  </div>
</section>
<!-- END -->
<section id="end" class="screen">
  <div class="card">
    <div class="big" id="endTitle">🎉 You did it, Vera! 🎉</div>
    <div class="stars" id="endStars"></div>
    <p id="endScore"></p>
    <p id="endFirst"></p>
    <p class="newbest hidden" id="endBest">🏆 New best score! 🏆</p>
    <p id="endBestLine" style="font-weight:normal"></p>
    <div class="row">
      <button class="btn next" id="againBtn">🔁 Play again</button>
      <button class="btn home" id="menuBtn">🏠 Menu</button>
    </div>
  </div>
</section>

/* ---------- build map ---------- */
function buildMap(svg, opts){

    var g = document.createElementNS(SVGNS,"g");
    g.setAttribute("class","reg"); g.setAttribute("data-id",r.id);

      var h = document.createElementNS(SVGNS,"path");
      h.setAttribute("d",MAP.hits[r.id]); h.setAttribute("class","hit"); g.appendChild(h);
    }
    var p = document.createElementNS(SVGNS,"path");

var curVB = FULL.slice(), zoomed=false, zoomAnim=null;

  var from = curVB.slice(), t0 = performance.now(), dur = instant?0:450;

}

}
function repositionTags(){ tags.forEach(positionTag); updateRing(); }
function clearTags(){ tags.forEach(function(t){t.remove();}); tags=[]; }
window.addEventListener("resize", function(){ setTimeout(repositionTags,60); });
window.addEventListener("orientationchange", function(){ setTimeout(repositionTags,300); });

/* ring around small highlighted regions (Name mode) */
var ringId=null;
function updateRing(){
  if (!ringId){ ringEl.style.display="none"; return; }
  var bb = MAP.regions[ringId].bbox, scale = curVB[2]/FULL[2];
  var cx=(bb[0]+bb[2])/2, cy=(bb[1]+bb[3])/2, r=Math.max(bb[2]-bb[0],bb[3]-bb[1])/2;
  ringEl.setAttribute("cx",cx); ringEl.setAttribute("cy",cy); ringEl.setAttribute("r", r+Math.max(4,22*scale));
  ringEl.style.display="";
}

/* ---------- sounds (no network, WebAudio) ---------- */
var actx=null;
function tone(freqs, dur){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var t = actx.currentTime;
    freqs.forEach(function(f,i){
      var o=actx.createOscillator(), g=actx.createGain();
      o.type="triangle"; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      var st=t+i*dur; g.gain.setValueAtTime(0.0001,st); g.gain.exponentialRampToValueAtTime(0.18,st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,st+dur); o.start(st); o.stop(st+dur+0.02);
    });
  }catch(e){}
}
var sGood=function(){tone([523,659,784,1047],0.11);}, sBad=function(){tone([300,220],0.18);};

/* ---------- game state ---------- */
var CHEERS=["Awesome! 🎉","Great job! 🌟","You got it! 🙌","Super! 🥳","Way to go, Vera! 💪","Fantastic! ✨","Brilliant! 🍁","Yes!! 🎊"];
var CHEER_EMO=["🎉","🌟","🥳","👏","🍁","✨","💯","🦫"];
var st=null;
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }
function rand(a){ return a[Math.floor(Math.random()*a.length)]; }
function bestKey(m){ return "veraCanadaMap.best."+m; }
function getBest(m){ try{ var v=localStorage.getItem(bestKey(m)); return v===null?null:parseInt(v,10);}catch(e){return null;} }
function setBest(m,v){ try{ localStorage.setItem(bestKey(m), String(v)); }catch(e){} }
function showBest(){
  var f=getBest("find"), n=getBest("name");
  $("bestFind").textContent = "🏆 Best: "+(f===null?"–":f+" / 130");
  $("bestName").textContent = "🏆 Best: "+(n===null?"–":n+" / 130");
}
function show(id){ ["start","game","end"].forEach(function(s){ $(s).classList.toggle("on", s===id); }); }

function resetMapClasses(){
  svg.querySelectorAll(".reg").forEach(function(g){ g.classList.remove("green","red","target","reveal","picked"); });
  ringId=null; updateRing(); clearTags();
}
function startMode(mode){
  st = {mode:mode, queue:shuffle(REGIONS.map(function(r){return r.id;})), done:{}, missed:{}, score:0, firstTry:0, cur:null, tries:0, locked:false};
  show("game"); resetMapClasses(); setZoom(false,true);
  $("choices").innerHTML=""; $("fb").textContent=""; $("fb").className="fb"; $("nextBtn").classList.add("hidden");
  $("learnbar").classList.toggle("hidden", mode!=="learn");
  $("choices").classList.toggle("hidden", mode!=="name");
  $("prog").classList.toggle("hidden", mode==="learn"); $("score").classList.toggle("hidden", mode==="learn");
  $("gTitle").textContent = mode==="find"?"👆 Find it on the map":mode==="name"?"🤔 Name it":"🔍 Practice / Learn";
  if (mode==="learn"){ allShown=false; $("allNames").textContent="🏷️ Show all names";
    $("prompt").innerHTML='<span class="q">Explore!</span>Tap any place 👆'; $("fb").textContent="Tap 🔍 to zoom in on the east coast."; return; }
  nextQ();
}
function updateStats(){
  $("prog").textContent = "✅ "+Object.keys(st.done).length+"/13";
  $("score").textContent = "⭐ "+st.score;
}
function nextQ(){
  resetMapClasses(); $("nextBtn").classList.add("hidden"); $("fb").textContent=""; $("fb").className="fb";
  if (zoomed) setZoom(false, true);
  updateStats();
  if (!st.queue.length){ return endRound(); }
  st.cur = st.queue.shift(); st.tries=0; st.locked=false;
  var r = BYID[st.cur], again = st.missed[st.cur] ? ' <span style="font-size:.6em">(one more try! 💪)</span>' : '';
  if (st.mode==="find"){
    $("prompt").innerHTML = '<span class="q">Find this '+r.type+' on the map:</span>'+r.name+again;
  } else {
    $("prompt").innerHTML = '<span class="q">What is the name of the yellow '+(again?'place?':'place?')+'</span>🟡 Pick a name!'+again;
    var g=regEl(st.cur); g.classList.add("target"); g.parentNode.appendChild(g); svg.appendChild(ringEl);
    var bb=MAP.regions[st.cur].bbox; if (Math.max(bb[2]-bb[0],bb[3]-bb[1])<120 && !zoomed){ ringId=st.cur; } updateRing();
    var opts = shuffle([st.cur].concat(shuffle(REGIONS.map(function(x){return x.id;}).filter(function(x){return x!==st.cur;})).slice(0,4)));
    var ch=$("choices"); ch.innerHTML="";
    opts.forEach(function(id){
      var b=document.createElement("button"); b.className="choice"; b.textContent=BYID[id].name; b.dataset.id=id;
      b.addEventListener("click", function(){ onChoice(id,b); }); ch.appendChild(b);
    });
  }
}
function cheer(){
  var c=$("cheer"); c.textContent=rand(CHEER_EMO); c.classList.remove("go"); void c.offsetWidth; c.classList.add("go");
}
function markCorrect(points){
  st.score+=points; if(!st.missed[st.cur]&&st.tries===0) st.firstTry++;
  st.done[st.cur]=true; updateStats();
}
function miss(){
  st.missed[st.cur]=true; st.queue.push(st.cur);
}
/* Find mode tap */
svg.addEventListener("click", function(ev){
  var g = ev.target.closest ? ev.target.closest(".reg") : null;
  if (!g || !st) return;
  var id = g.getAttribute("data-id");
  if (st.mode==="learn") return learnTap(id);
  if (st.mode!=="find" || st.locked) return;
  var r = BYID[id];
  if (id===st.cur){
    st.locked=true; resetMapClasses(); g.classList.add("green"); g.parentNode.appendChild(g);
    addTag(id,"green", "✅ "+r.name);
    var pts = st.missed[st.cur]?2:(st.tries===0?10:5);
    markCorrect(pts); sGood(); cheer();
    $("fb").className="fb good"; $("fb").textContent = rand(CHEERS)+" +"+pts;
    setTimeout(nextQ, 1500);
  } else {
    sBad(); resetMapClasses(); g.classList.add("red");
    addTag(id,"red", "❌ That's "+r.name);
    st.tries++;
    if (st.tries===1){
      $("fb").className="fb bad"; $("fb").textContent = "Oops! That's "+r.name+". Try again! 🙂";
      setTimeout(function(){ if(st.tries===1 && !st.locked){ g.classList.remove("red"); } }, 1200);
    } else {
      st.locked=true; var redTag=tags[tags.length-1]; setTimeout(function(){ if(redTag){ redTag.remove(); tags=tags.filter(function(t){return t!==redTag;}); } }, 450);
      var cg=regEl(st.cur); cg.classList.add("reveal"); cg.parentNode.appendChild(cg);
      if ((st.cur==="PE"||st.cur==="NS"||st.cur==="NB") && !zoomed) setZoom(true);
      var want=st.cur; setTimeout(function(){ if(st.cur===want && st.locked) addTag(want,"yel","👉 Here is "+BYID[want].name+"!"); }, zoomed?0:480);
      $("fb").className="fb"; $("fb").textContent = "That was "+r.name+". Good try! We'll come back to "+BYID[st.cur].name+" later. 💪";
      miss(); $("nextBtn").classList.remove("hidden");
    }
  }
});
/* Name mode choice */
function onChoice(id, b){
  if (st.locked) return; st.locked=true;
  var right = id===st.cur, rb = $("choices").querySelector('[data-id="'+st.cur+'"]');
  $("choices").querySelectorAll(".choice").forEach(function(x){ if(x!==b&&x!==rb) x.classList.add("dim"); });
  rb.classList.add("right"); var g=regEl(st.cur); g.classList.remove("target");
  if (right){
    g.classList.add("green"); addTag(st.cur,"green","✅ "+BYID[st.cur].name);
    var pts = st.missed[st.cur]?2:10; markCorrect(pts); sGood(); cheer();
    $("fb").className="fb good"; $("fb").textContent = rand(CHEERS)+" +"+pts;
    setTimeout(nextQ, 1500);
  } else {
    b.classList.add("wrong"); g.classList.add("reveal"); sBad();
    addTag(st.cur,"yel","👉 This is "+BYID[st.cur].name);
    $("fb").className="fb"; $("fb").textContent = "Nice try! It's "+BYID[st.cur].name+". It'll come back later. 💪";
    miss(); $("nextBtn").classList.remove("hidden");
  }
}
$("nextBtn").addEventListener("click", nextQ);
/* Learn mode */
var allShown=false;
function learnTap(id){
  if (allShown) return;
  var r=BYID[id]; resetMapClasses(); var g=regEl(id); g.classList.add("picked"); g.parentNode.appendChild(g);
  addTag(id,"", r.name+"<small>"+(r.type==="province"?"Province":"Territory")+" · Capital: "+r.cap+"</small>");
  $("prompt").innerHTML='<span class="q">This '+r.type+' is…</span>'+r.name;
  $("fb").textContent = "Tap another one! 👆"; tone([660,880],0.08);
}
$("allNames").addEventListener("click", function(){
  allShown=!allShown; resetMapClasses();
  $("allNames").textContent = allShown?"🙈 Hide names":"🏷️ Show all names";
  if (allShown){ REGIONS.forEach(function(r){ addTag(r.id,"small", zoomed||["NB","NS","PE"].indexOf(r.id)<0?r.name:(r.id==="PE"?"PEI":r.id)); }); }
});
$("zoomBtn").addEventListener("click", function(){ if(st&&st.mode==="learn"&&allShown){ setTimeout(function(){ clearTags(); REGIONS.forEach(function(r){ addTag(r.id,"small", zoomed||["NB","NS","PE"].indexOf(r.id)<0?r.name:(r.id==="PE"?"PEI":r.id)); }); },470); } else if (st && st.mode==="name"){ var bb=MAP.regions[st.cur]&&MAP.regions[st.cur].bbox; if(bb&&!st.locked){ ringId = (!zoomed && Math.max(bb[2]-bb[0],bb[3]-bb[1])<120)?st.cur:null; updateRing(); } } });

/* ---------- end of round ---------- */
function endRound(){
  var stars = st.firstTry>=12?3:st.firstTry>=8?2:1;
  var prev = getBest(st.mode), isBest = prev===null || st.score>prev;
  if (isBest) setBest(st.mode, st.score);
  $("endStars").innerHTML = "<span>⭐</span>".repeat(stars)+"<span style='opacity:.25'>⭐</span>".repeat(3-stars);
  $("endTitle").textContent = stars===3?"🎉 AMAZING, Vera! 🎉":stars===2?"🎉 Great work, Vera! 🎉":"🎉 You did it, Vera! 🎉";
  $("endScore").textContent = "Score: "+st.score+" / 130";
  $("endFirst").textContent = "You got "+st.firstTry+" of 13 right on the first try! 🍁";
  $("endBest").classList.toggle("hidden", !isBest || prev===null && false);
  $("endBestLine").textContent = "🏆 Best score: "+Math.max(st.score, prev||0);
  show("end"); confetti();
}
function confetti(){
  var em=["🎉","⭐","🍁","🎊","✨","🌟","💖","🇨🇦"];
  for (var i=0;i<36;i++){
    var c=document.createElement("div"); c.className="confetti"; c.textContent=rand(em);
    c.style.left=(Math.random()*100)+"vw"; c.style.animationDuration=(2.5+Math.random()*2.5)+"s"; c.style.animationDelay=(Math.random()*1.5)+"s";
    $("end").appendChild(c); (function(c){ setTimeout(function(){c.remove();},7000); })(c);
  }
}
$("againBtn").addEventListener("click", function(){ startMode(st.mode); });
$("menuBtn").addEventListener("click", function(){ showBest(); show("start"); });
$("homeBtn").addEventListener("click", function(){ clearTags(); showBest(); show("start"); });
$("mFind").addEventListener("click", function(){ startMode("find"); });
$("mName").addEventListener("click", function(){ startMode("name"); });
$("mLearn").addEventListener("click", function(){ startMode("learn"); });
document.addEventListener("gesturestart", function(e){ e.preventDefault(); });
document.addEventListener("dblclick", function(e){ e.preventDefault(); });
showBest();
/* test hook */
window.__vera = { state:function(){return st;}, start:startMode, regions:REGIONS };
</script>
